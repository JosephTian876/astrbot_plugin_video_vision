name: CI

# 门禁只有两条：ruff（pin 到 AstrBot 自己用的版本）与 pytest（2 平台 × 4 版本）。
# 不跑 ruff format（本仓库尚未 format，见 ARCH-REVIEW §7.1：format 门禁应单独一个提交）。

on:
  push:
    branches: [main, master, "fix/**", "feat/**"]
    paths-ignore: ["**/*.md", "logo.png"]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消旧的一跑（矩阵 8 lane，旧跑白占 runner）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # 缺 ffmpeg 时**失败**而不是静默 skip（否则 CI 绿得莫名其妙：约 40 例被跳过）
  VV_REQUIRE_FFMPEG: "1"

jobs:
  lint:
    name: lint (ruff 0.15.22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 必须 pin：同一个仓库
      #   ruff 0.15.22（AstrBot 的 pin）→ All checks passed!
      #   ruff 0.17.x（默认规则已扩）  → 30 个 error
      # 不 pin 的 lint 门禁等于没有门禁。
      - name: Install pinned ruff
        run: python -m pip install "ruff==0.15.22"

      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        # Windows runner 默认 pwsh；用 bash 让两端命令一致
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      # ubuntu-latest 镜像**不带** ffmpeg；用 apt 装要拉 87 个包 / 173MB，runner 网络慢时
      # 单个包就能耗 3 分钟（2026-10-26 实测：三次重试全被 timeout 打断）。
      # 改用预编译静态包：从 GitHub 自家 Releases 下载（无 apt 依赖），通常十几秒。
      # 每一步都套 `timeout`，网络再差也不会挂住整轮。
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -n 1)"
            exit 0
          fi
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          rm -rf /tmp/ffmpeg-dist && mkdir -p /tmp/ffmpeg-dist
          for attempt in 1 2 3; do
            echo "::group::download attempt ${attempt}"
            if timeout 300 curl -fsSL --retry 2 -o /tmp/ffmpeg.tar.xz "$url" &&
               timeout 120 tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-dist --strip-components=1; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "download attempt ${attempt} failed; sleeping 10s"
            sleep 10
          done
          # 注意：不要用 `find /tmp` 找 bin 目录 —— runner 的 /tmp 里有 systemd-private-*
          # 无权限目录，bash 的 pipefail 会让整步以非零退出（2026-10-26 实测踩过）。
          test -x /tmp/ffmpeg-dist/bin/ffmpeg
          sudo install -m 0755 /tmp/ffmpeg-dist/bin/ffmpeg /tmp/ffmpeg-dist/bin/ffprobe /usr/local/bin/
          command -v ffmpeg
          command -v ffprobe

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already on PATH"
          else
            choco install ffmpeg --no-progress -y
            echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi

      - name: Install test deps
        run: python -m pip install -r tests/requirements-dev.txt

      # VV_REQUIRE_FFMPEG=1：这一步红了就是 runner 没装好，比后面 40 例静默 skip 好
      - name: Show toolchain
        run: |
          python -V
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: pytest
        run: >
          python -m pytest -q
          --junitxml=junit-${{ matrix.os }}-py${{ matrix.python }}.xml

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit-*.xml
          retention-days: 7
          if-no-files-found: warn
